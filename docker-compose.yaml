services:
  postgres:
    image: postgres:17-alpine
    container_name: macauth-db
    restart: unless-stopped
    profiles: [db]
    environment:
      POSTGRES_DB: macauth
      POSTGRES_USER: macauth_user
      POSTGRES_PASSWORD: macauth_9876
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macauth_user -d macauth"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: macauth-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "2800:2800"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./storage:/app/storage

volumes:
  postgres_data:
